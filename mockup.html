<script>

  const list = document.getElementById('list');
  const filter = document.getElementById('filter');
  const sortBox = document.getElementById('sort');
  const themeBtn = document.getElementById('theme');
  const CATEGORIES = ['Work', 'Personal', 'Others'];
  let seq = 0;

  // 8x8 pixel-art icons drawn as crisp SVG squares
  const ICONS = {
    edit: ['......##', '.....###', '....###.', '...###..', '..###...', '.###....', '###.....', '##......'],
    trash: ['..####..', '########', '.######.', '.#.##.#.', '.#.##.#.', '.#.##.#.', '.######.', '........'],
    sun: ['...##...', '.#.##.#.', '..####..', '#.####.#', '#.####.#', '..####..', '.#.##.#.', '...##...'],
    moon: ['..####..', '.###....', '###.....', '###.....', '###.....', '###.....', '.###..##', '..####..']
  };
  function icon(name) {
    const ns = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(ns, 'svg');
    svg.setAttribute('viewBox', '0 0 8 8');
    ICONS[name].forEach((row, y) => [...row].forEach((c, x) => {
      if (c !== '#') return;
      const r = document.createElementNS(ns, 'rect');
      r.setAttribute('x', x); r.setAttribute('y', y);
      r.setAttribute('width', 1); r.setAttribute('height', 1);
      svg.append(r);
    }));
    return svg;
  }

  // Dark/light mode (remembers the choice; defaults to the system setting)
  function setTheme(theme) {
    root.dataset.theme = theme;
    themeBtn.replaceChildren(icon(theme === 'dark' ? 'moon' : 'sun'), theme.toUpperCase());
    try { localStorage.setItem('theme', theme); } catch (e) {}
  }
  let saved = null;
  try { saved = localStorage.getItem('theme'); } catch (e) {}
  setTheme(saved || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'));
  themeBtn.addEventListener('click', () => setTheme(root.dataset.theme === 'dark' ? 'light' : 'dark'));

  function today() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  // Apply sort and category filter
  function refreshView() {
    const items = [...list.children].sort((a, b) => {
      if (sortBox.checked) {
        const da = a.dataset.due || '9999-99-99', db = b.dataset.due || '9999-99-99';

    });

    items.forEach(li => { li.hidden = !!filter.value &amp;&amp; li.dataset.cat !== filter.value; });
  }
  filter.addEventListener('change', refreshView);
  sortBox.addEventListener('change', refreshView);

  function renderMeta(li, meta) {
    meta.replaceChildren();
    const tag = document.createElement('span');
    tag.className = 'tag';
    tag.textContent = li.dataset.cat.toUpperCase();
    meta.append(tag);
    if (li.dataset.due) {
      const d = document.createElement('span');
      d.textContent = 'DUE ' + li.dataset.due;
      if (li.dataset.due < today()) d.className = 'overdue';

    const li = document.createElement('li');
    li.dataset.cat = category;
    li.dataset.due = due;
    li.dataset.seq = seq++;

    span.className = 'text';
    span.textContent = text;
    const meta = document.createElement('div');

    renderMeta(li, meta);

      c.value = li.dataset.cat;
      const d = Object.assign(document.createElement('input'), { type: 'date', value: li.dataset.due });
      f.append(t, c, d);

      let finished = false;
      const finish = save => {
        if (finished) return;
        finished = true;
        if (save &amp;&amp; t.value.trim()) {
          span.textContent = t.value.trim();
          li.dataset.cat = c.value;
          li.dataset.due = d.value;
          renderMeta(li, meta);
        }
        f.replaceWith(span, meta);
        edit.disabled = false;
        refreshView();
      };
      f.addEventListener('keydown', e => {
        if (e.key === 'Enter') finish(true);
        if (e.key === 'Escape') finish(false);
      });
      // Save when focus leaves the whole edit group
      f.addEventListener('focusout', e => {
        if (!f.contains(e.relatedTarget)) finish(true);
      });
      span.replaceWith(f);
      meta.remove();
      edit.disabled = true;
      t.focus();
      t.select();
    });

    const del = document.createElement('button');
    del.append(icon('trash'));
    del.title = 'Delete';
    del.addEventListener('click', () => li.remove());

    li.append(box, main, edit, del);
    list.append(li);
    refreshView();
  }

  form.addEventListener('submit', e => {
    e.preventDefault();
    const text = textIn.value.trim();
    if (!text) return;
    addTask(text, catIn.value, dueIn.value);
    textIn.value = dueIn.value = '';
    textIn.focus();
  });
</script>
