<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>To-Do</title>
<!-- Pixel font; falls back to monospace if offline -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
  /* Blue and white: dark mode = white on blue, light mode = blue on white */
  :root { --bg: #0000ff; --fg: #fff; --grid: #ffffff14; color-scheme: dark; }
  :root[data-theme=light] { --bg: #fff; --fg: #0000ff; --grid: #0000ff14; color-scheme: light; }

  * { box-sizing: border-box; border-radius: 0; }
  body {
    font-family: 'Press Start 2P', monospace; font-size: 11px; line-height: 1.6;
    background: var(--bg); color: var(--fg);
    background-image: linear-gradient(var(--grid) 50%, transparent 50%); background-size: 4px 4px;
    margin: 0; padding: 24px 12px;
  }
  .app { max-width: 560px; margin: 0 auto; padding: 20px; background: var(--bg); border: 4px solid var(--fg); box-shadow: 8px 8px 0 var(--fg); }
  .app { text-align: center; }
  header { display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 14px; margin-bottom: 18px; }
  input[type=text], input[type=date], select { text-align: center; text-align-last: center; }
  .controls { justify-content: center; }
  h1 { font-size: 22px; margin: 0; text-shadow: 3px 3px 0 var(--grid); }
  [hidden] { display: none !important; }

  form, .fields { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  form .task, .fields .task { flex: 1 1 100%; }
  input[type=text], input[type=date], select {
    font: inherit; color: var(--fg); background: var(--bg);
    border: 4px solid var(--fg); padding: 8px; min-width: 0; outline: none; border-style: solid;
  }
  input[type=text]:focus, input[type=date]:focus, select:focus { outline: 4px dotted var(--fg); outline-offset: 2px; }
  input::placeholder { color: var(--fg); opacity: .5; }

  button {
    font: inherit; cursor: pointer; color: var(--fg); background: var(--bg);
    border: 4px solid var(--fg); padding: 8px 14px; box-shadow: 4px 4px 0 var(--fg);
    display: inline-flex; align-items: center; gap: 8px;
  }
  button:hover { color: var(--bg); background: var(--fg); }
  button:active { transform: translate(4px, 4px); box-shadow: none; }
  button:disabled { opacity: .4; cursor: default; }
  button svg { width: 16px; height: 16px; fill: currentColor; shape-rendering: crispEdges; flex: none; }

  .controls { display: flex; gap: 16px; flex-wrap: wrap; margin: 18px 0 8px; font-size: 9px; align-items: center; }
  .controls label { display: flex; align-items: center; gap: 8px; }

  ul { list-style: none; padding: 0; margin: 0; }
  li { display: flex; align-items: center; gap: 10px; padding: 10px; margin-top: 12px; border: 4px solid var(--fg); box-shadow: 4px 4px 0 var(--fg); }
  .main { flex: 1; min-width: 0; word-break: break-word; }
  .meta { font-size: 8px; margin-top: 8px; }
  .tag { background: var(--fg); color: var(--bg); padding: 2px 6px; margin-right: 8px; }
  .overdue { text-decoration: underline wavy; }
  li.done { border-style: dashed; }
  li.done .text { text-decoration: line-through; opacity: .5; }

  /* pixel checkbox: hollow square -> filled square with inner gap */
  input[type=checkbox] {
    appearance: none; -webkit-appearance: none; flex: none; margin: 0; cursor: pointer;
    width: 22px; height: 22px; background: var(--bg); border: 4px solid var(--fg); padding: 0;
  }
  input[type=checkbox]:checked { background: var(--fg); box-shadow: inset 0 0 0 3px var(--bg); }
  input[type=checkbox]:focus-visible { outline: 4px dotted var(--fg); outline-offset: 2px; }

  li button { padding: 6px; }
</style>
</head>
<body>
<div class="app">
<header>
  <h1>TO-DO</h1>
  <button type="button" id="theme" title="Switch dark/light mode"></button>
</header>
<form id="form">
  <input type="text" id="text" class="task" placeholder="NEW TASK" autofocus>
  <select id="category" title="Category">
    <option>Work</option><option>Personal</option><option>Others</option>
  </select>
  <input type="date" id="due" title="Due date">
  <button type="submit">ADD</button>
</form>
<div class="controls">
  <label>SHOW
    <select id="filter">
      <option value="">All</option><option>Work</option><option>Personal</option><option>Others</option>
    </select>
  </label>
  <label><input type="checkbox" id="sort"> SORT BY DUE</label>
</div>
<ul id="list"></ul>
</div>
<script>
  const root = document.documentElement;
  const form = document.getElementById('form');
  const textIn = document.getElementById('text');
  const catIn = document.getElementById('category');
  const dueIn = document.getElementById('due');
  const list = document.getElementById('list');
  const filter = document.getElementById('filter');
  const sortBox = document.getElementById('sort');
  const themeBtn = document.getElementById('theme');
  const CATEGORIES = ['Work', 'Personal', 'Others'];
  let seq = 0;

  // 8x8 pixel-art icons drawn as crisp SVG squares
  const ICONS = {
    edit: ['......##', '.....###', '....###.', '...###..', '..###...', '.###....', '###.....', '##......'],
    trash: ['..####..', '########', '.######.', '.#.##.#.', '.#.##.#.', '.#.##.#.', '.######.', '........'],
    sun: ['...##...', '.#.##.#.', '..####..', '#.####.#', '#.####.#', '..####..', '.#.##.#.', '...##...'],
    moon: ['..####..', '.###....', '###.....', '###.....', '###.....', '###.....', '.###..##', '..####..']
  };
  function icon(name) {
    const ns = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(ns, 'svg');
    svg.setAttribute('viewBox', '0 0 8 8');
    ICONS[name].forEach((row, y) => [...row].forEach((c, x) => {
      if (c !== '#') return;
      const r = document.createElementNS(ns, 'rect');
      r.setAttribute('x', x); r.setAttribute('y', y);
      r.setAttribute('width', 1); r.setAttribute('height', 1);
      svg.append(r);
    }));
    return svg;
  }

  // Dark/light mode (remembers the choice; defaults to the system setting)
  function setTheme(theme) {
    root.dataset.theme = theme;
    themeBtn.replaceChildren(icon(theme === 'dark' ? 'moon' : 'sun'), theme.toUpperCase());
    try { localStorage.setItem('theme', theme); } catch (e) {}
  }
  let saved = null;
  try { saved = localStorage.getItem('theme'); } catch (e) {}
  setTheme(saved || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'));
  themeBtn.addEventListener('click', () => setTheme(root.dataset.theme === 'dark' ? 'light' : 'dark'));

  function today() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  // Apply sort and category filter
  function refreshView() {
    const items = [...list.children].sort((a, b) => {
      if (sortBox.checked) {
        const da = a.dataset.due || '9999-99-99', db = b.dataset.due || '9999-99-99';
        if (da !== db) return da < db ? -1 : 1;
      }
      return a.dataset.seq - b.dataset.seq;
    });
    list.append(...items);
    items.forEach(li => { li.hidden = !!filter.value && li.dataset.cat !== filter.value; });
  }
  filter.addEventListener('change', refreshView);
  sortBox.addEventListener('change', refreshView);

  function renderMeta(li, meta) {
    meta.replaceChildren();
    const tag = document.createElement('span');
    tag.className = 'tag';
    tag.textContent = li.dataset.cat.toUpperCase();
    meta.append(tag);
    if (li.dataset.due) {
      const d = document.createElement('span');
      d.textContent = 'DUE ' + li.dataset.due;
      if (li.dataset.due < today()) d.className = 'overdue';
      meta.append(d);
    }
  }

  function addTask(text, category, due) {
    const li = document.createElement('li');
    li.dataset.cat = category;
    li.dataset.due = due;
    li.dataset.seq = seq++;

    const box = document.createElement('input');
    box.type = 'checkbox';
    box.addEventListener('change', () => li.classList.toggle('done', box.checked));

    const main = document.createElement('div');
    main.className = 'main';
    const span = document.createElement('div');
    span.className = 'text';
    span.textContent = text;
    const meta = document.createElement('div');
    meta.className = 'meta';
    main.append(span, meta);
    renderMeta(li, meta);

    const edit = document.createElement('button');
    edit.append(icon('edit'));
    edit.title = 'Edit';
    edit.addEventListener('click', () => {
      const f = document.createElement('div');
      f.className = 'fields';
      const t = Object.assign(document.createElement('input'), { type: 'text', className: 'task', value: span.textContent });
      const c = document.createElement('select');
      CATEGORIES.forEach(name => c.append(Object.assign(document.createElement('option'), { textContent: name })));
      c.value = li.dataset.cat;
      const d = Object.assign(document.createElement('input'), { type: 'date', value: li.dataset.due });
      f.append(t, c, d);

      let finished = false;
      const finish = save => {
        if (finished) return;
        finished = true;
        if (save && t.value.trim()) {
          span.textContent = t.value.trim();
          li.dataset.cat = c.value;
          li.dataset.due = d.value;
          renderMeta(li, meta);
        }
        f.replaceWith(span, meta);
        edit.disabled = false;
        refreshView();
      };
      f.addEventListener('keydown', e => {
        if (e.key === 'Enter') finish(true);
        if (e.key === 'Escape') finish(false);
      });
      // Save when focus leaves the whole edit group
      f.addEventListener('focusout', e => {
        if (!f.contains(e.relatedTarget)) finish(true);
      });
      span.replaceWith(f);
      meta.remove();
      edit.disabled = true;
      t.focus();
      t.select();
    });

    const del = document.createElement('button');
    del.append(icon('trash'));
    del.title = 'Delete';
    del.addEventListener('click', () => li.remove());

    li.append(box, main, edit, del);
    list.append(li);
    refreshView();
  }

  form.addEventListener('submit', e => {
    e.preventDefault();
    const text = textIn.value.trim();
    if (!text) return;
    addTask(text, catIn.value, dueIn.value);
    textIn.value = dueIn.value = '';
    textIn.focus();
  });
</script>
</body>
</html>
